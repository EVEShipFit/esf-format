name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Download the latest SDE
        run: uv run esf sde
      - name: Run the test cases
        run: uv run esf-test -- .venv/bin/esf
      - name: Check the binary files with protobuf
        run: uv run python check_protobuf.py
